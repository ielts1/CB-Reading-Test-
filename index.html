<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cambridge Reading Practice</title>
<style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--muted:#667085;--line:#dfe4ec;--accent:#155eef;--ok:#07883d;--bad:#d92d20}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}.top{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);padding:12px 18px;display:flex;gap:12px;align-items:center}.brand{font-weight:800}.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 13px;cursor:pointer}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.wrap{max-width:1250px;margin:auto;padding:22px}.grid{display:grid;grid-template-columns:300px 1fr;gap:18px}.panel,.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}.list{max-height:calc(100vh - 125px);overflow:auto}.test{padding:10px;border-radius:9px;cursor:pointer;margin:4px 0}.test:hover,.test.active{background:#eef4ff}.muted{color:var(--muted)}h1,h2,h3{margin-top:0}.passage{line-height:1.75;white-space:pre-wrap;font-size:16px}.q{border-top:1px solid var(--line);padding:18px 0}.q:first-child{border-top:0}.qtext{white-space:pre-wrap;line-height:1.55}.ans{margin-top:10px;padding:9px;border:1px solid #98a2b3;border-radius:7px;min-width:180px}.result{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.stat{padding:14px;border:1px solid var(--line);border-radius:10px;text-align:center}.stat b{display:block;font-size:24px}.review-ok{border-left:4px solid var(--ok);padding-left:12px}.review-bad{border-left:4px solid var(--bad);padding-left:12px}.pill{display:inline-block;padding:4px 8px;border-radius:99px;background:#eef4ff;color:#155eef;font-size:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}.hidden{display:none}@media(max-width:900px){.grid{grid-template-columns:1fr}.list{max-height:300px}.two{grid-template-columns:1fr}.result{grid-template-columns:1fr 1fr}}
</style></head><body>
<div class="top"><div class="brand">Cambridge Reading Practice</div><button class="btn" onclick="showHome()">All Tests</button><button class="btn" onclick="toggleReview()">Review</button><span id="status" class="muted"></span></div>
<div class="wrap" id="app"></div>
<script>
let DATA=[], current=null, answers={}, submitted=false;
const $=s=>document.querySelector(s);
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
async function init(){DATA=await fetch('data.json').then(r=>r.json());showHome();}
function showHome(){current=null;submitted=false;answers={};$('#status').textContent=DATA.length+' passage tests';let groups={};DATA.forEach(x=>{let m=x.title.match(/Cambridge\s+(\d+)/i);let g=m?m[1]:'Other';(groups[g]??=[]).push(x)});let list=Object.entries(groups).map(([g,arr])=>`<div class="card"><h3>Cambridge ${esc(g)}</h3>${arr.map(x=>`<div class="test" onclick="openTest('${x.id}')">${esc(x.title)}</div>`).join('')}</div>`).join('');$('#app').innerHTML=`<h1>Cambridge Reading Tests</h1><p class="muted">Each available Passage PDF is a separate practice test. ${DATA.length} tests loaded.</p><div class="grid"><div class="panel list">${list}</div><div class="panel"><h2>Choose a test</h2><p>Select a Passage from the list. The test opens without answers or explanations.</p><p class="muted">After Submit, Review shows your answer, source answer data where available, location, keyword, tip/paraphrase and vocabulary extracted from the supplied PDFs.</p></div></div>`}
function openTest(id){current=DATA.find(x=>x.id===id);submitted=false;answers={};renderTest();window.scrollTo(0,0)}
function detectInput(q){let t=q.text.toLowerCase();if(/choose the correct letter|choose one|choose two|choose three|a\)|b\)|c\)|d\)/.test(t)){return `<input class="ans" data-n="${q.number}" placeholder="Your answer">`}return `<input class="ans" data-n="${q.number}" placeholder="Your answer">`}
function renderTest(){if(!current)return;$('#status').textContent=current.title;let qs=current.questions;$('#app').innerHTML=`<div class="card"><button class="btn" onclick="showHome()">← Back to tests</button> <span class="pill">${esc(current.title)}</span><h1>${esc(current.title)}</h1><div class="two"><section><h2>Passage</h2><div class="passage">${esc(current.passage)}</div></section><section><h2>Questions</h2>${qs.length?qs.map(q=>`<div class="q"><div><b>${q.number}.</b> <span class="qtext">${esc(q.text)}</span></div>${detectInput(q)}</div>`).join(''):`<div class="qtext">${esc(current.questionText)}</div>`}<button class="btn primary" onclick="submitTest()">Submit Test</button></section></div></div>`}
function submitTest(){document.querySelectorAll('.ans').forEach(i=>answers[i.dataset.n]=i.value.trim());submitted=true;let nums=Object.keys(current.review);let correct=0,answered=0;nums.forEach(n=>{if(answers[n])answered++;let a=(current.review[n]?.answer||'').trim().toLowerCase();if(a&&answers[n]&&answers[n].toLowerCase()===a)correct++});let total=current.questions.length||nums.length||0;let wrong=Math.max(0,answered-correct),un=Math.max(0,total-answered);let band=total?bandScore(correct,total):'—';$('#app').innerHTML=`<div class="card"><h1>Test Result</h1><h2>${esc(current.title)}</h2><div class="result"><div class="stat"><b>${correct}</b>Correct</div><div class="stat"><b>${wrong}</b>Wrong</div><div class="stat"><b>${un}</b>Unanswered</div><div class="stat"><b>${band}</b>Band</div></div><div style="margin-top:18px"><button class="btn primary" onclick="toggleReview(true)">Test Review</button> <button class="btn" onclick="renderTest()">Retake</button> <button class="btn" onclick="showHome()">All Tests</button></div></div>`}
function bandScore(c,total){let p=c/total; if(p>=.98)return 9;if(p>=.95)return 8.5;if(p>=.90)return 8;if(p>=.85)return 7.5;if(p>=.75)return 7;if(p>=.65)return 6.5;if(p>=.55)return 6;if(p>=.45)return 5.5;if(p>=.35)return 5;if(p>=.25)return 4.5;if(p>=.15)return 4;return 3.5}
function toggleReview(force){if(!current)return showHome();let qs=current.questions;let html=`<div class="card"><button class="btn" onclick="showHome()">← All Tests</button><h1>Test Review</h1><h2>${esc(current.title)}</h2><p class="muted">Your answers and source-derived review material.</p>${qs.map(q=>{let r=current.review[String(q.number)]||{};let your=answers[String(q.number)]||'—';let corr=r.answer||'Not extracted';let ok=corr.toLowerCase()===your.toLowerCase()&&corr!=='Not extracted';return `<div class="q ${ok?'review-ok':'review-bad'}"><b>${q.number}.</b> ${esc(q.text)}<p><b>Your answer:</b> ${esc(your)}</p><p><b>Correct answer:</b> ${esc(corr)}</p>${r.location?`<p><b>Location:</b> ${esc(r.location)}</p>`:''}${r.keyword?`<p><b>Keyword:</b> ${esc(r.keyword)}</p>`:''}${r.tip?`<p><b>Tip / Paraphrase:</b> ${esc(r.tip)}</p>`:''}</div>`}).join('')} ${current.vocabulary?`<div class="card"><h2>Vocabulary</h2><div class="passage">${esc(current.vocabulary)}</div></div>`:''}${current.vocabularyQuiz?`<div class="card"><h2>Vocabulary Quiz</h2><div class="passage">${esc(current.vocabularyQuiz)}</div></div>`:''}</div>`;$('#app').innerHTML=html}
init();
</script></body></html>
